<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leevin Stay Cork — Saint Nicholas House B | Tour 360°</title>
<!-- URLs de preview já preenchidas para: https://gstruk.github.io/LeevinStay/saint-nicholas-house-b/ -->
<meta property="og:type" content="website">
<meta property="og:title" content="Saint Nicholas House B — 360° Virtual Tour">
<meta property="og:description" content="Explore the house in 360° · Leevin Stay Cork">
<meta property="og:image" content="https://gstruk.github.io/LeevinStay/saint-nicholas-house-b/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://gstruk.github.io/LeevinStay/saint-nicholas-house-b/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Saint Nicholas House B — 360° Virtual Tour">
<meta name="twitter:description" content="Explore the house in 360° · Leevin Stay Cork">
<meta name="twitter:image" content="https://gstruk.github.io/LeevinStay/saint-nicholas-house-b/preview.jpg">
<meta name="description" content="360° virtual tour of Saint Nicholas House B — Leevin Stay Cork.">
<script src="https://cdn.jsdelivr.net/npm/marzipano@0.10.2/dist/marzipano.js"></script>
<style>
  :root{
    --navy:#1f3a5f;
    --ink:#22252a;
    --white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0e0f11}
  body{font-family:Calibri,"Segoe UI",system-ui,sans-serif;color:var(--ink)}

  #pano{position:absolute;inset:0;background:#0e0f11}

  /* carregamento */
  #loader{
    position:absolute;inset:0;z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0e0f11;color:#fff;gap:18px;transition:opacity .5s;
  }
  #loader .lb{font-family:Cambria,Georgia,serif;font-size:22px;letter-spacing:.5px}
  #loader .ls{font-size:13px;opacity:.55;letter-spacing:1px}
  #loader .bar{width:180px;height:2px;background:rgba(255,255,255,.15);overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#fff;animation:slide 1.1s infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

  /* cabeçalho */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:flex-start;gap:14px;padding:20px 26px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));
  }
  .logo{height:34px;width:auto;border-radius:7px;display:block;flex:none;margin-top:1px;pointer-events:none}
  .brand-block{display:flex;flex-direction:column;line-height:1.1}
  .brand{font-family:Cambria,Georgia,serif;font-size:19px;letter-spacing:.4px;color:#fff;font-weight:600}
  .property{
    display:flex;align-items:center;gap:8px;margin-top:3px;
    font-family:Calibri,sans-serif;font-size:13px;letter-spacing:.3px;color:#fff;opacity:.82;
  }
  .property .map-link{display:inline-flex;pointer-events:auto;transition:transform .2s,opacity .2s;opacity:.9}
  .property .map-link:hover{transform:scale(1.12);opacity:1}
  .property .map-link img{width:17px;height:17px;display:block}

  /* rótulo da cena */
  .scene-label{position:absolute;left:28px;bottom:118px;z-index:15;color:#fff;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.6)}
  .scene-label .n{font-family:Cambria,Georgia,serif;font-size:12px;letter-spacing:3px;opacity:.6;display:block;margin-bottom:5px}
  .scene-label .t{font-family:Cambria,Georgia,serif;font-size:30px;font-weight:600;line-height:1.05}
  .scene-label .t-es,.scene-label .t-pt{font-family:Cambria,Georgia,serif;font-size:17px;font-weight:400;line-height:1.15;opacity:.72;margin-top:2px}
  .scene-label .floor{
    display:inline-block;margin-top:10px;font-family:Calibri,sans-serif;font-size:11px;
    letter-spacing:1.8px;text-transform:uppercase;color:#fff;opacity:.7;
    border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:3px 9px;
  }

  /* botão fixo de próximo cômodo */
  .next-btn{
    position:absolute;left:28px;bottom:74px;z-index:17;
    display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    background:rgba(15,17,20,.55);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.22);border-radius:30px;
    padding:8px 16px 8px 8px;color:#fff;
    font-family:Calibri,sans-serif;font-size:14px;letter-spacing:.3px;
    transition:background .2s,border-color .2s;
  }
  .next-btn:hover{background:rgba(15,17,20,.78);border-color:rgba(255,255,255,.45)}
  .next-btn .arrow{
    width:32px;height:32px;border-radius:50%;flex:none;
    background:#f5a623;display:flex;align-items:center;justify-content:center;
  }
  .next-btn .arrow svg{width:17px;height:17px;fill:#1f2124}
  .next-btn .nb-text{opacity:.95}
  .next-btn .nb-target{opacity:.6;font-size:12.5px}

  /* navegação inferior */
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:18;display:flex;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
  .nav button{
    flex:1;border:0;background:transparent;cursor:pointer;padding:18px 8px 20px;
    color:rgba(255,255,255,.6);font-family:Calibri,sans-serif;font-size:13.5px;letter-spacing:.3px;
    border-top:2px solid transparent;transition:color .25s,border-color .25s;
  }
  .nav button:hover{color:#fff}
  .nav button.active{color:#fff;border-top-color:#fff}
  .nav button .idx{display:block;font-family:Cambria,serif;font-size:10px;letter-spacing:2px;opacity:.5;margin-bottom:5px}

  /* hotspots */
  .hotspot{
    width:46px;height:46px;margin-left:-23px;margin-top:-23px;border-radius:50%;
    background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.35);transition:transform .2s,background .2s;
  }
  .hotspot:hover{transform:scale(1.12);background:#fff}
  .hotspot svg{width:21px;height:21px;fill:var(--navy)}
  .hotspot .tip{
    position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--navy);color:#fff;
    white-space:nowrap;font-size:12px;letter-spacing:.3px;padding:5px 11px;border-radius:3px;opacity:0;
    pointer-events:none;transition:opacity .2s;
  }
  .hotspot:hover .tip{opacity:1}

  .hint{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:16;
    color:#fff;font-size:12px;letter-spacing:.4px;opacity:.75;pointer-events:none;
    background:rgba(0,0,0,.28);padding:6px 14px;border-radius:20px;transition:opacity .6s;
  }

  @media (max-width:600px){
    .nav button{font-size:11px;padding:14px 4px 16px}
    .scene-label .t{font-size:22px}
    .scene-label .t-es,.scene-label .t-pt{font-size:13px}
    .scene-label{bottom:104px;left:20px}
    .next-btn{left:20px;bottom:66px;font-size:13px;padding:7px 14px 7px 7px}
    .logo{height:28px}
    .brand{font-size:16px}
    .property{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){.hotspot,.nav button{transition:none}#loader .bar i{animation:none;width:100%}}
</style>
</head>
<body>

<div id="pano"></div>

<div id="loader">
  <div class="lb">Saint Nicholas House B</div>
  <div class="ls">LOADING 360° TOUR</div>
  <div class="bar"><i></i></div>
</div>

<div class="topbar">
  <img class="logo" src="images/logo.png" alt="Leevin Student">
  <div class="brand-block">
    <div class="brand">Leevin Stay</div>
    <div class="property">
      <span>Saint Nicholas House B</span>
    </div>
    <div class="property" style="margin-top:2px;font-size:12px;opacity:.72">
      <a class="map-link" href="https://www.google.com/maps/place/18+St.+Nicholas+Square,+Ballymacthomas,+Cork/@51.9029168,-8.4823116,35a,75y,298.93h,85.95t/data=!3m7!1e1!3m5!1sP2iavsa7MetUfn4oZshzuQ!2e0!6shttps:%2F%2Fstreetviewpixels-pa.googleapis.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D4.047374374794202%26panoid%3DP2iavsa7MetUfn4oZshzuQ%26yaw%3D298.92518957490233!7i16384!8i8192!4m7!3m6!1s0x484490144bad9cdf:0xec0e8cf96741ab55!8m2!3d51.9030917!4d-8.4824547!10e5!16s%2Fg%2F11csj7jt8r?entry=tts" target="_blank" rel="noopener noreferrer" title="Open in Google Maps">
        <img src="images/map.png" alt="Google Maps">
      </a>
      <span>- Cork, Ireland</span>
    </div>
  </div>
</div>

<div class="hint" id="hint">Drag to look around · tap the arrows to move</div>

<div class="scene-label" id="sceneLabel"></div>

<button class="next-btn" id="nextBtn" type="button">
  <span class="arrow"><svg viewBox="0 0 24 24"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg></span>
  <span class="nb-text">Next room</span>
  <span class="nb-target" id="nbTarget"></span>
</button>

<nav class="nav" id="nav"></nav>

<script>
window.SCENE_IMAGES = {
  "entrance":  "images/entrance.jpg",
  "hall":      "images/hall.jpg",
  "rooms1415": "images/rooms1415.jpg",
  "stairs":    "images/stairs.jpg",
  "rooms1617": "images/rooms1617.jpg",
  "bath3":     "images/bath3.jpg",
  "rooms1819": "images/rooms1819.jpg",
  "kitchen1":  "images/kitchen1.jpg",
  "kitchen2":  "images/kitchen2.jpg",
  "kitchen3":  "images/kitchen3.jpg"
};
</script>
<script>
(function(){
  var Marzipano = window.Marzipano;
  var IMG = window.SCENE_IMAGES;

  // ---- Estrutura da casa: ordem física real ----
  // yaw/pitch dos hotspots em radianos — ajuste fino conforme a foto
  var scenesData = [
    { id:'entrance',  num:'01', title:'Entrance', title_es:'Entrada', title_pt:'Entrada', floor:'Outside', img:IMG.entrance,
      hotspots:[ {target:'hall', label:'Enter', yaw:0.0, pitch:0.12} ] },

    { id:'hall',      num:'02', title:'Entrance Hall', title_es:'Recibidor', title_pt:'Hall de entrada', floor:'Ground Floor', img:IMG.hall,
      hotspots:[
        {target:'entrance',  label:'Out to the yard',   yaw:1.4, pitch:0.10},
        {target:'rooms1415', label:'Rooms 14 & 15',     yaw:-1.9, pitch:0.05}
      ] },

    { id:'rooms1415', num:'03', title:'Rooms 14 & 15 — Ground Floor', title_es:'Habitaciones 14 y 15', title_pt:'Quartos 14 e 15', floor:'Ground Floor', img:IMG.rooms1415,
      hotspots:[
        {target:'hall',   label:'Back to the hall', yaw:1.2, pitch:0.05},
        {target:'stairs', label:'Up the stairs',    yaw:-1.5, pitch:0.10}
      ] },

    { id:'stairs',    num:'04', title:'Stairs & Hall — First Floor', title_es:'Escalera y pasillo', title_pt:'Escada e hall', floor:'First Floor', img:IMG.stairs,
      hotspots:[
        {target:'rooms1415', label:'Downstairs',    yaw:1.2, pitch:0.20},
        {target:'rooms1617', label:'Rooms 16 & 17', yaw:-1.5, pitch:0.05}
      ] },

    { id:'rooms1617', num:'05', title:'Rooms 16 & 17 — Bathroom 2', title_es:'Habitaciones 16 y 17 — Baño 2', title_pt:'Quartos 16 e 17 — Banheiro 2', floor:'First Floor', img:IMG.rooms1617,
      hotspots:[
        {target:'stairs', label:'Back to the stairs', yaw:2.6, pitch:0.05},
        {target:'bath3',  label:'Bathroom 3',         yaw:0.2, pitch:0.05}
      ] },

    { id:'bath3',     num:'06', title:'Bathroom 3 — Corridor', title_es:'Baño 3 — pasillo', title_pt:'Banheiro 3 — corredor', floor:'First Floor', img:IMG.bath3,
      hotspots:[
        {target:'rooms1617', label:'Back to rooms 16 & 17', yaw:2.4, pitch:0.05},
        {target:'rooms1819', label:'Rooms 18 & 19',         yaw:0.2, pitch:0.05}
      ] },

    { id:'rooms1819', num:'07', title:'Rooms 18 & 19 — Corridor', title_es:'Habitaciones 18 y 19', title_pt:'Quartos 18 e 19', floor:'First Floor', img:IMG.rooms1819,
      hotspots:[
        {target:'bath3',    label:'Back to bathroom 3', yaw:2.4, pitch:0.05},
        {target:'kitchen1', label:'To the kitchen',     yaw:0.2, pitch:0.05}
      ] },

    { id:'kitchen1',  num:'08', title:'Kitchen — Worktop & Table', title_es:'Cocina — encimera y mesa', title_pt:'Cozinha — bancada e mesa', floor:'First Floor', img:IMG.kitchen1,
      hotspots:[
        {target:'rooms1819', label:'Back to the corridor', yaw:2.4, pitch:0.05},
        {target:'kitchen2',  label:'More of the kitchen',  yaw:0.4, pitch:0.05}
      ] },

    { id:'kitchen2',  num:'09', title:'Kitchen', title_es:'Cocina', title_pt:'Cozinha', floor:'First Floor', img:IMG.kitchen2,
      hotspots:[
        {target:'kitchen1', label:'Back to worktop & table', yaw:2.4, pitch:0.05},
        {target:'kitchen3', label:'Laundry area',            yaw:0.4, pitch:0.05}
      ] },

    { id:'kitchen3',  num:'10', title:'Kitchen & Laundry', title_es:'Cocina y lavandería', title_pt:'Cozinha e lavanderia', floor:'First Floor', img:IMG.kitchen3,
      hotspots:[
        {target:'kitchen2', label:'Back to the kitchen', yaw:0.4, pitch:0.05}
      ] }
  ];

  var viewer = new Marzipano.Viewer(document.getElementById('pano'), { controls:{ mouseViewMode:'drag' } });
  var limiter = Marzipano.RectilinearView.limit.traditional(1536, 110*Math.PI/180);
  var scenes = {};

  scenesData.forEach(function(d){
    var geometry = new Marzipano.EquirectGeometry([{ width:4096 }]);
    var source = Marzipano.ImageUrlSource.fromString(d.img);
    var view = new Marzipano.RectilinearView({ yaw:0, pitch:0, fov:100*Math.PI/180 }, limiter);
    var scene = viewer.createScene({ source:source, geometry:geometry, view:view });
    d.hotspots.forEach(function(h){
      scene.hotspotContainer().createHotspot(buildHotspot(h), { yaw:h.yaw, pitch:h.pitch });
    });
    scenes[d.id] = { scene:scene, data:d };
  });

  function switchTo(id){
    var s = scenes[id], d = s.data;
    s.scene.switchTo({ transitionDuration:600 });
    document.getElementById('sceneLabel').innerHTML =
      '<span class="n">'+d.num+'</span>'+
      '<span class="t">'+d.title+'</span>'+
      '<div class="t-es">'+d.title_es+'</div>'+
      '<div class="t-pt">'+d.title_pt+'</div>'+
      '<span class="floor">'+d.floor+'</span>';
    document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('active', b.dataset.id===id); });

    // botão fixo "Next room": segue a ordem linear do tour (última cena volta ao início)
    var i = scenesData.findIndex(function(x){ return x.id===id; });
    var next = scenesData[(i+1) % scenesData.length];
    document.getElementById('nextBtn').dataset.target = next.id;
    document.getElementById('nbTarget').textContent = '· ' + next.title;
  }

  var nav = document.getElementById('nav');
  scenesData.forEach(function(d){
    var b = document.createElement('button');
    b.dataset.id = d.id;
    b.innerHTML = '<span class="idx">'+d.num+'</span>'+d.title;
    b.onclick = function(){ switchTo(d.id); };
    nav.appendChild(b);
  });

  function buildHotspot(h){
    var el = document.createElement('div');
    el.className='hotspot';
    el.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg><span class="tip">'+h.label+'</span>';
    el.addEventListener('click', function(e){ e.stopPropagation(); switchTo(h.target); });
    return el;
  }

  document.getElementById('nextBtn').addEventListener('click', function(){
    switchTo(this.dataset.target);
  });

  // esconde loader quando a primeira cena estiver pronta
  scenes['entrance'].scene.switchTo();
  switchTo('entrance');
  setTimeout(function(){
    var l=document.getElementById('loader'); l.style.opacity='0';
    setTimeout(function(){ l.style.display='none'; }, 500);
  }, 700);
  setTimeout(function(){ document.getElementById('hint').style.opacity='0'; }, 5000);
})();
</script>
</body>
</html>
